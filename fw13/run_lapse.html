<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherif Fix - PS4 Lapse</title>
<link rel="icon" type="image/jpeg" href="icon0.jpg">
<link rel="shortcut icon" href="icon0.jpg">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #040811;
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  #brand {
    text-align: center;
    padding: 10px 14px;
    background: rgba(8, 16, 32, 0.9);
    border-bottom: 2px solid #00d2ff;
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #brand img {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
    border: 1.5px solid #00d2ff;
    vertical-align: middle;
  }
  #brand b {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
    vertical-align: middle;
  }
  #wrap { padding: 16px 18px; }
  #state {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 10px;
    color: #00d2ff;
  }
  #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: #09101d;
    border: 1px solid rgba(0, 210, 255, 0.3);
    border-radius: 8px;
    padding: 12px 14px;
    height: calc(100vh - 120px);
    overflow-y: auto;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
  }
  .ok { color: #00ffcc; font-weight: bold; }
  .bad { color: #ff5e36; font-weight: bold; }
  .warn { color: #ffbe0b; font-weight: bold; }
</style>
</head>
<body>
<div id="brand">
  <img src="icon0.jpg" onerror="this.src='../icon0.jpg';" alt="Sherif Fix">
  <b>SHERIF FIX</b>
</div>
<div id="wrap">
  <div id="state">loading lapse chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
