<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sherif Fix - FW 13.00 Webkit Host</title>
<link rel="icon" type="image/jpeg" href="icon0.jpg">
<link rel="shortcut icon" href="icon0.jpg">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100vh;
  background-image: url('img.jpg'), url('../img.jpg');
  background-position: center center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-color: #040811;
  color: #fff;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  position: relative;
}

#wrap {
  position: relative;
  z-index: 1;
  max-width: 1250px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.system-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 24px;
  background: rgba(8, 16, 32, 0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 18px;
  border: 1.5px solid #00d2ff;
  box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mini {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  object-fit: cover;
  border: 1.5px solid #00d2ff;
  box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
}

.brand-text-mini {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 0 0 12px rgba(0, 210, 255, 0.9);
}

.system-status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #00ffcc;
  text-transform: uppercase;
}

.live-pulse {
  width: 8px;
  height: 8px;
  background: #00ffcc;
  border-radius: 50%;
  box-shadow: 0 0 12px #00ffcc;
  animation: pulseLight 1.5s infinite;
}

@keyframes pulseLight {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}

#header {
  text-align: center;
  margin: 5px 0 auto;
  padding: 5px 0;
}

#header h1 {
  font-size: 75px;
  font-weight: 950;
  line-height: 0.95;
  letter-spacing: 5px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 30%, #00d2ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}

#state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 22px 28px;
  max-width: 880px;
  margin: 0 auto 20px;
  background: rgba(10, 20, 38, 0.75);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  border: 1.5px solid #00d2ff;
  box-shadow: 0 0 25px rgba(0, 210, 255, 0.45);
  text-align: center;
}

.hud-content-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
}

.loader {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 3.5px solid rgba(255, 255, 255, 0.08);
  border-top-color: #00d2ff;
  border-right-color: #00ffcc;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loader.done {
  animation: none;
  border: 4px solid #34d399;
}

#stateText {
  font-size: 21px;
  font-weight: 900;
  color: #ffffff;
  line-height: 1.4;
  text-align: center;
  width: 100%;
}

#stateText small {
  font-size: 13.5px;
  color: #a8c4e0;
  display: block;
  margin-top: 4px;
}

.hud-right-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #00d2ff;
  padding: 6px 14px;
  border-radius: 10px;
  background: rgba(0, 170, 255, 0.15);
  border: 1px solid #00d2ff;
  text-transform: uppercase;
  margin-top: 10px;
}

.btn-back-home {
  display: block;
  width: fit-content;
  margin: 0 auto;
  padding: 8px 26px;
  font-size: 14px;
  font-weight: 800;
  color: #ffffff;
  background: rgba(0, 116, 228, 0.3);
  border: 1.5px solid #00d2ff;
  border-radius: 20px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.25s ease;
}

.btn-back-home:hover {
  background: #0074e4;
  box-shadow: 0 0 25px rgba(0, 116, 228, 0.8);
}

#out-container {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div class="system-bar">
    <div class="brand-badge">
      <img src="icon0.jpg" onerror="this.src='../icon0.jpg';" alt="Sherif Fix" class="logo-mini">
      <div class="brand-text-mini">SHERIF FIX</div>
    </div>
    <div class="system-status-indicator">
      <div class="live-pulse"></div>
      FW 13.00 Webkit Active
    </div>
  </div>

  <div id="header">
    <h1>SHERIF FIX</h1>
    <div id="state">
      <div class="hud-content-center">
        <div id="loader" class="loader"></div>
        <div id="stateText">
          جارٍ فحص الكاش وحفظ الملفات أوفلاين...
          <br><small>Checking offline cache status...</small>
        </div>
      </div>
      <div id="statusBadge" class="hud-right-badge">Checking Cache</div>
    </div>
    <a href="../index.html" class="btn-back-home">⬅ الرجوع للصفحة الرئيسية</a>
  </div>

  <div id="out-container">
    <div id="out"></div>
  </div>
</div>

<script>
const loader = document.getElementById("loader");
const state = document.getElementById("state");
const stateText = document.getElementById("stateText");
const statusBadge = document.getElementById("statusBadge");

let isCaching = false;

if (window.applicationCache) {
  window.applicationCache.addEventListener('downloading', function () {
    isCaching = true;
    statusBadge.innerText = "Caching Files";
    stateText.innerHTML = "جارٍ حفظ الملفات أوفلاين في الجهاز...<br><small>Downloading files for offline usage...</small>";
  });

  window.applicationCache.addEventListener('progress', function (e) {
    isCaching = true;
    let progress = Math.round((e.loaded / e.total) * 100);
    stateText.innerHTML = `جارٍ حفظ الملفات أوفلاين (${progress}%)<br><small>Caching: ${e.loaded} of ${e.total} files</small>`;
  });

  window.applicationCache.addEventListener('cached', function () {
    statusBadge.innerText = "Cached OK";
    loader.classList.add("done");
    stateText.innerHTML = "تم حفظ الهوست أوفلاين بنجاح! 💾<br><small>Cache Complete! You can now turn OFF internet and bookmark this page.</small>";
    setTimeout(startExploit, 2000);
  });

  window.applicationCache.addEventListener('updateready', function () {
    window.applicationCache.swapCache();
    location.reload();
  });

  window.applicationCache.addEventListener('noupdate', function () {
    startExploit();
  });

  window.applicationCache.addEventListener('error', function () {
    startExploit();
  });
} else {
  startExploit();
}

window.poopsDone = function () {
  loader.classList.add("done");
  statusBadge.innerText = "Success";
  stateText.innerHTML = "تم تشغيل الثغرة بنجاح! ✅<br><small>FW 13.00 Exploit Active.</small>";
};

window.poopsError = function () {
  loader.classList.remove("done");
  statusBadge.innerText = "Error";
  stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>Execution failed. Please reload page.</small>";
};

function startExploit() {
  if (isCaching) return;
  statusBadge.innerText = "Executing";
  stateText.innerHTML = "يجرى الآن تهكير جهازك...<br><small>Executing payload sequence, please wait...</small>";
  setTimeout(async () => {
    try {
      await import("./chain_poops.js");
    } catch (err) {
      console.error(err);
      window.poopsError();
    }
  }, 1000);
}
</script>

</body>
</html>
